name: Run zkSBOM proofs

on:
  workflow_call:
    inputs:
      zk_method:
        required: true
        type: string
      sbom_path:
        required: true
        type: string
      vendor:
        required: true
        type: string
      product:
        required: true
        type: string
      version:
        required: true
        type: string
      inclusion_check:
        required: true
        type: string
      inclusion_output:
        required: true
        type: string
      non_inclusion_check:
        required: true
        type: string
      non_inclusion_output:
        required: true
        type: string
      zksbom_template:
        required: true
        type: string
      zksbom_output:
        required: true
        type: string
      verifier_template:
        required: true
        type: string
      verifier_output:
        required: true
        type: string
      api_key:
        required: false
        default: "123"
        type: string
      sbom_artifact_name:
        required: false
        default: ""
        type: string
    secrets:
      github_token:
        required: true

jobs:
  build:
    uses: ./.github/workflows/reusable-build-ozks-library.yml

  run:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          submodules: true

      - name: Download SBOM artifact
        if: inputs.sbom_artifact_name != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5
        with:
          name: ${{ inputs.sbom_artifact_name }}
          path: .

      - name: Configure zksbom
        env:
          GH_TOKEN: ${{ secrets.github_token }}
        run: |
          mkdir -p zksbom/tmp/output zksbom/tmp/database
          sed \
            -e "s|YOUR_TOKEN|${GH_TOKEN}|g" \
            "${{ inputs.zksbom_template }}" \
            > "${{ inputs.zksbom_output }}"

      - name: Configure zksbom-verifier
        run: cp "${{ inputs.verifier_template }}" "${{ inputs.verifier_output }}"

      - name: Upload SBOM to zksbom
        working-directory: zksbom
        run: |
          ./target/release/zksbom upload_sbom \
            --api-key "${{ inputs.api_key }}" \
            --sbom "${{ inputs.sbom_path }}"

      - name: Get zkSBOM commitment
        id: commitment
        working-directory: zksbom
        run: |
          OUTPUT=$(./target/release/zksbom get_commitment \
            --vendor "${{ inputs.vendor }}" \
            --product "${{ inputs.product }}" \
            --version "${{ inputs.version }}" \
            --method "${{ inputs.zk_method }}")
          echo "$OUTPUT"
          COMMITMENT=$(echo "$OUTPUT" | grep -oP 'Commitment:\s*\K\S+')
          echo "value=${COMMITMENT}" >> "$GITHUB_OUTPUT"

      - name: Generate inclusion proof
        working-directory: zksbom
        run: |
          ./target/release/zksbom create_proof \
            --api-key "${{ inputs.api_key }}" \
            --method "${{ inputs.zk_method }}" \
            --commitment "${{ steps.commitment.outputs.value }}" \
            --output "${{ inputs.inclusion_output }}" \
            --check "${{ inputs.inclusion_check }}"

      - name: Verify inclusion proof
        working-directory: zksbom-verifier
        run: |
          ./target/release/zksbom-verifier verify \
            --method "${{ inputs.zk_method }}" \
            --commitment "${{ steps.commitment.outputs.value }}" \
            --proof_path "../zksbom/${{ inputs.inclusion_output }}"

      - name: Generate non-inclusion proof
        working-directory: zksbom
        run: |
          ./target/release/zksbom create_proof \
            --api-key "${{ inputs.api_key }}" \
            --method "${{ inputs.zk_method }}" \
            --commitment "${{ steps.commitment.outputs.value }}" \
            --output "${{ inputs.non_inclusion_output }}" \
            --check "${{ inputs.non_inclusion_check }}"

      - name: Verify non-inclusion proof
        working-directory: zksbom-verifier
        run: |
          ./target/release/zksbom-verifier verify \
            --method "${{ inputs.zk_method }}" \
            --commitment "${{ steps.commitment.outputs.value }}" \
            --proof_path "../zksbom/${{ inputs.non_inclusion_output }}"

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: zksbom-proofs
          path: |
            zksbom/${{ inputs.inclusion_output }}
            zksbom/${{ inputs.non_inclusion_output }}
