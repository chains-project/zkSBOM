name: RQ1 - TARmageddon Demo

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      zk_method:
        description: "ZK commitment algorithm"
        required: false
        default: "ozks"
        type: choice
        options:
          - ozks
          - merkle-tree
          - sparse-merkle-tree
          - merkle-patricia-trie

jobs:
  tarmageddon-zksbom:
    name: TARmageddon Demo
    runs-on: ubuntu-22.04

    env:
      # Proof target
      CVE: "CVE-2025-62518"
      ZK_METHOD: ${{ github.event.inputs.zk_method || 'ozks' }}

    steps:
      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      # ──────────────────────────────────────────────────────────────────────
      # Phase 1: Checkout correct `uv` version (tag: 0.9.4) and create SBOM.
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout uv@0-9-4
        working-directory: rq1/uv
        run: |
          git fetch --force --tags origin
          git checkout "tags/0.9.4"

      - name: Generate SBOM using `cyclonedx`
        working-directory: rq1/uv/crates/uv
        run: |
          cargo cyclonedx --format json

      - name: Verify SBOM is created
        working-directory: rq1/uv/crates/uv
        run: |
          if [ -f "uv.cdx.json" ]; then
            echo "SBOM found."
          else
            echo "SBOM file missing!"
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      # Phase 2a: Build oZKS (C++) + zkSBOM (Rust)
      # ──────────────────────────────────────────────────────────────────────
      - name: Setup common zkSBOM build environment
        uses: ./.github/workflows/templates/build-ozks-library.yml

      # ──────────────────────────────────────────────────────────────────────
      # Phase 2b: Upload SBOM → Generate proof → Verify
      # ──────────────────────────────────────────────────────────────────────
      - name: Configure zkSBOM tools
        uses: ./.github/workflows/templates/configure-zksbom.yml
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          zksbom_template: zksbom/config/config_template.toml
          zksbom_output: zksbom/config/config.toml
          verifier_template: zksbom-verifier/config/config_template.toml
          verifier_output: zksbom-verifier/config/config.toml

      - name: Run upload + proof generation + verification
        uses: ./.github/workflows/templates/run-zksbom.yml
        with:
          zk_method: ${{ env.ZK_METHOD }}
          sbom_path: ../rq1/uv/crates/uv/uv.cdx.json
          vendor: uv
          product: uv
          version: 0.9.4
          inclusion_check: ${{ env.CVE }}
          inclusion_output: ./tmp/output/uv-proof-inclusion-CVE-2025-62518.txt
          non_inclusion_check: CVE-2025-55182
          non_inclusion_output: ./tmp/output/uv-proof-non-inclusion-CVE-2025-55182.txt

      # ──────────────────────────────────────────────────────────────────────
      # Artifacts
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload SBOM and proof as artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: rq1-outputs
          path: |
            rq1/uv/crates/uv/uv.cdx.json
            zksbom/tmp/output/uv-proof-inclusion-CVE-2025-62518.txt
            zksbom/tmp/output/uv-proof-non-inclusion-CVE-2025-55182.txt
