name: RQ1 - TARmageddon Demo

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      zk_method:
        description: "ZK commitment algorithm"
        required: false
        default: "ozks"
        type: choice
        options:
          - ozks
          - merkle-tree
          - sparse-merkle-tree
          - merkle-patricia-trie

jobs:
  tarmageddon-zksbom:
    name: TARmageddon Demo
    runs-on: ubuntu-22.04

    env:
      # Proof target
      CVE: "CVE-2025-62518"
      ZK_METHOD: ${{ github.event.inputs.zk_method || 'ozks' }}

    steps:
      # ──────────────────────────────────────────────────────────────────────
      # Checkout
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          submodules: true

      # ──────────────────────────────────────────────────────────────────────
      # Tool-chain setup
      # ──────────────────────────────────────────────────────────────────────
      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx
      # ──────────────────────────────────────────────────────────────────────
      # Caches
      # ──────────────────────────────────────────────────────────────────────
      - name: Cache Cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zksbom/target
            zksbom-verifier/target
          key: cargo-${{ hashFiles('zksbom/Cargo.lock', 'zksbom-verifier/Cargo.lock') }}
          restore-keys: cargo-

      - name: Cache vcpkg
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('zksbom/third_party/oZKS/CMakeLists.txt') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # ──────────────────────────────────────────────────────────────────────
      # Phase 1: Checkout correct `uv` version (tag: 0.9.4) and create SBOM.
      # ──────────────────────────────────────────────────────────────────────
      - name: Checkout uv@0-9-4
        working-directory: rq1/uv
        run: |
          git fetch --force --tags origin
          git checkout "tags/0.9.4"

      - name: Generate SBOM using `cyclonedx`
        working-directory: rq1/uv/crates/uv
        run: |
          cargo cyclonedx --format json

      - name: Verify SBOM is created
        working-directory: rq1/uv/crates/uv
        run: |
          if [ -f "uv.cdx.json" ]; then
            echo "SBOM found."
          else
            echo "SBOM file missing!"
            exit 1
          fi
      
      # ──────────────────────────────────────────────────────────────────────
      # Phase 2a: Build oZKS (C++) + zkSBOM (Rust)
      # ──────────────────────────────────────────────────────────────────────
      - name: Install system build dependencies for oZKS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libssl-dev libgmp-dev \
            nasm

      - name: Bootstrap vcpkg
        run: |
          if [ ! -f "vcpkg/bootstrap-vcpkg.sh" ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg --depth=1
          fi
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build oZKS via CMake + vcpkg
        run: |
          cd zksbom/third_party/oZKS
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DOZKS_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Build zksbom
        run: |
          cd zksbom
          CMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            cargo build --release

      - name: Reuse zksbom oZKS build for verifier
        # Both submodules pin the same oZKS commit, so symlinking the already-built
        # vcpkg headers and compiled libs avoids a redundant second CMake build.
        run: |
          mkdir -p zksbom-verifier/third_party/oZKS
          ln -sfn "${GITHUB_WORKSPACE}/zksbom/third_party/oZKS/build" \
            zksbom-verifier/third_party/oZKS/build

      - name: Build zksbom-verifier
        run: |
          cd zksbom-verifier
          CMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            cargo build --release

      # ──────────────────────────────────────────────────────────────────────
      # Phase 2b: Upload SBOM → Generate proof → Verify
      # ──────────────────────────────────────────────────────────────────────
      - name: Configure zksbom
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p zksbom/tmp/output zksbom/tmp/database
          sed \
            -e "s|YOUR_TOKEN|${GH_TOKEN}|g" \
            zksbom/config/config_template.toml \
            > zksbom/config/config.toml

      - name: Configure zksbom-verifier
        run: cp zksbom-verifier/config/config_template.toml zksbom-verifier/config/config.toml

      - name: Upload uv SBOM to zksbom
        working-directory: zksbom
        run: |
          ./target/release/zksbom upload_sbom \
            --api-key 123 \
            --sbom "../rq1/uv/crates/uv/uv.cdx.json"
          echo "✓ SBOM uploaded"

      - name: Get zkSBOM commitment for uv
        id: commitment
        working-directory: zksbom
        run: |
          OUTPUT=$(./target/release/zksbom get_commitment \
            --vendor "uv" \
            --product "uv" \
            --version "0.9.4" \
            --method "${ZK_METHOD}")
          echo "$OUTPUT"
          COMMITMENT=$(echo "$OUTPUT" | grep -oP 'Commitment:\s*\K\S+')
          echo "value=${COMMITMENT}" >> "$GITHUB_OUTPUT"
          echo "✓ Commitment: ${COMMITMENT}"

      - name: Generate ZK proof that uv SBOM contains CVE-2025-62518
        working-directory: zksbom
        run: |
          ./target/release/zksbom create_proof \
            --api-key 123 \
            --method "${ZK_METHOD}" \
            --commitment "${{ steps.commitment.outputs.value }}" \
            --output "./tmp/output/uv-proof-inclusion-CVE-2025-62518.txt" \
            --check "${CVE}"
          echo "✓ ZK proof written to zksbom/tmp/output/uv-proof-inclusion-CVE-2025-62518.txt"

      - name: Verify ZK inclusion proof (CVE-2025-62518)
        working-directory: zksbom-verifier
        run: |
          ./target/release/zksbom-verifier verify \
            --method "${ZK_METHOD}" \
            --commitment "${{ steps.commitment.outputs.value }}" \
            --proof_path "../zksbom/tmp/output/uv-proof-inclusion-CVE-2025-62518.txt"

      - name: Generate ZK non-inclusion proof that Druid SBOM does NOT contain CVE-2025-55182
        # CVE-2025-55182 is absent from uv's dependency tree.
        # This proves the dependency is not present without revealing the full dependency list.
        working-directory: zksbom
        run: |
          ./target/release/zksbom create_proof \
            --api-key 123 \
            --method "${ZK_METHOD}" \
            --commitment "${{ steps.commitment.outputs.value }}" \
            --output "./tmp/output/uv-proof-non-inclusion-CVE-2025-55182.txt" \
            --check "CVE-2025-55182"
          echo "✓ Non-inclusion proof written to zksbom/tmp/output/uv-proof-non-inclusion-CVE-2025-55182.txt"

      - name: Verify ZK non-inclusion proof (CVE-2025-55182)
        working-directory: zksbom-verifier
        run: |
          ./target/release/zksbom-verifier verify \
            --method "${ZK_METHOD}" \
            --commitment "${{ steps.commitment.outputs.value }}" \
            --proof_path "../zksbom/tmp/output/uv-proof-non-inclusion-CVE-2025-55182.txt"

      # ──────────────────────────────────────────────────────────────────────
      # Artifacts
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload SBOM and proof as artifacts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: rq1-outputs
          path: |
            rq1/uv/crates/uv/uv.cdx.json
            zksbom/tmp/output/uv-proof-inclusion-CVE-2025-62518.txt
            zksbom/tmp/output/uv-proof-non-inclusion-CVE-2025-55182.txt
