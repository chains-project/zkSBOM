name: Execute Tests

on:
    push:
      branches: [ main ]
    pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          submodules: true

      # ──────────────────────────────────────────────────────────────────────
      # Phase 1 — Build oZKS (C++) + zkSBOM (Rust)
      # ──────────────────────────────────────────────────────────────────────
      - name: Set up Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          cache: "false"

      - name: Cache Cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            zksbom-operator/target
            zksbom-verifier/target
          key: cargo-${{ hashFiles('zksbom-operator/Cargo.lock', 'zksbom-verifier/Cargo.lock') }}
          restore-keys: cargo-

      - name: Cache vcpkg
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('zksbom-operator/third_party/oZKS/CMakeLists.txt') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Install system build dependencies for oZKS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libssl-dev libgmp-dev \
            nasm

      - name: Bootstrap vcpkg
        run: |
          if [ ! -f "vcpkg/bootstrap-vcpkg.sh" ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg --depth=1
          fi
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build oZKS via CMake + vcpkg
        run: |
          cd zksbom-operator/third_party/oZKS
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DOZKS_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Build zksbom-operator
        run: |
          cd zksbom-operator
          CMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            cargo build --release

      - name: Reuse zksbom-operator oZKS build for verifier
        run: |
          mkdir -p zksbom-verifier/third_party/oZKS
          ln -sfn "${GITHUB_WORKSPACE}/zksbom/third_party/oZKS/build" \
            zksbom-verifier/third_party/oZKS/build

      - name: Build zksbom-verifier
        run: |
          cd zksbom-verifier
          CMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            cargo build --release

      # ──────────────────────────────────────────────────────────────────────
      # Phase 2 — Test zkSBOM
      # ──────────────────────────────────────────────────────────────────────
      - name: Configure zksbom
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p zksbom-operator/tmp/output zksbom-operator/tmp/database
          sed \
            -e "s|YOUR_TOKEN|${GH_TOKEN}|g" \
            zksbom-operator/tests/config/config_template.toml \
            > zksbom-operator/tests/config/config.toml

      - name: Configure zksbom-verifier
        run: |
          cp zksbom-verifier/tests/config/config_template.toml \
             zksbom-verifier/tests/config/config.toml
      
      - name: Test Version Extractions
        working-directory: zksbom-operator
        run: |
          cargo test --package zksbom-operator --test versions test_get_versions_go
          cargo test --package zksbom-operator --test versions test_get_versions_maven
          cargo test --package zksbom-operator --test versions test_get_versions_npm
          cargo test --package zksbom-operator --test versions test_get_versions_rust
          cargo test --package zksbom-operator --test versions test_vulnerable_range_less_than
          cargo test --package zksbom-operator --test versions test_compound_range
          cargo test --package zksbom-operator --test versions test_pre_release_versions

      - name: Test CVE Flow
        working-directory: zksbom-operator
        run: |
          cargo test --package zksbom-operator --test flow test_zksbom_operator_workflow_cve -- --exact
          cargo test --package zksbom-operator --test flow test_zksbom_operator_workflow_cve_concealed -- --exact

      - name: Test Dependency Flow
        working-directory: zksbom-operator
        run: |
          cargo test --package zksbom-operator --test flow test_zksbom_operator_workflow_dependency -- --exact
          cargo test --package zksbom-operator --test flow test_zksbom_operator_workflow_dependency_concealed -- --exact

      # ──────────────────────────────────────────────────────────────────────
      # Phase 3 — Test zkSBOM Verifier
      # ──────────────────────────────────────────────────────────────────────
      - name: Test zkSBOM Verifier Inclusion Proof CVE
        working-directory: zksbom-verifier
        run: cargo test --package zksbom-verifier --test inclusion_proof test_inclusion_proof

      - name: Test zkSBOM Verifier Inclusion Proof Dependency
        working-directory: zksbom-verifier
        run: cargo test --package zksbom-verifier --test inclusion_proof test_inclusion_proof_dependency

      - name: Test zkSBOM Verifier Non-Inclusion Proof CVE
        working-directory: zksbom-verifier
        run: cargo test --package zksbom-verifier --test non-inclusion_proof test_non_inclusion_proof

      - name: Test zkSBOM Verifier Non-Inclusion Proof Dependency
        working-directory: zksbom-verifier
        run: cargo test --package zksbom-verifier --test non-inclusion_proof test_non_inclusion_proof_dependency