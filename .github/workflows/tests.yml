name: Execute Tests

on:
    push:
      branches: [ master ]
    pull_request:
      branches: [ master ]


jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-22.04

    steps:
      # ──────────────────────────────────────────────────────────────────────
      # Phase 1 — Build oZKS (C++) + zkSBOM (Rust)
      # ──────────────────────────────────────────────────────────────────────
      - name: Setup common zkSBOM build environment
        uses: ./.github/workflows/templates/build-ozks-library.yml

      # ──────────────────────────────────────────────────────────────────────
      # Phase 2 — Test zkSBOM
      # ──────────────────────────────────────────────────────────────────────
      - name: Configure zkSBOM tools
        uses: ./.github/workflows/templates/configure-zksbom.yml
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          zksbom_template: zksbom/tests/config/config_template.toml
          zksbom_output: zksbom/tests/config/config.toml
          verifier_template: zksbom-verifier/tests/config/config_template.toml
          verifier_output: zksbom-verifier/tests/config/config.toml

      - name: Test CVE Flow
        working-directory: zksbom
        run: cargo test --package zksbom --test flow test_zksbom_workflow_cve

      - name: Test Dependency Flow
        working-directory: zksbom
        run: cargo test --package zksbom --test flow test_zksbom_workflow_dependency

      # ──────────────────────────────────────────────────────────────────────
      # Phase 3 — Test zkSBOM Verifier
      # ──────────────────────────────────────────────────────────────────────
      - name: Test zkSBOM Verifier Inclusion Proof CVE
        working-directory: zksbom-verifier
        run: cargo test --package zksbom-verifier --test inclusion_proof test_inclusion_proof

      - name: Test zkSBOM Verifier Inclusion Proof Dependency
        working-directory: zksbom-verifier
        run: cargo test --package zksbom-verifier --test inclusion_proof test_inclusion_proof_dependency

      - name: Test zkSBOM Verifier Non-Inclusion Proof CVE
        working-directory: zksbom-verifier
        run: cargo test --package zksbom-verifier --test non-inclusion_proof test_non_inclusion_proof

      - name: Test zkSBOM Verifier Non-Inclusion Proof Dependency
        working-directory: zksbom-verifier
        run: cargo test --package zksbom-verifier --test non-inclusion_proof test_non_inclusion_proof_dependency
